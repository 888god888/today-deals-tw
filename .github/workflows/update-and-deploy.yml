name: 更新每日好康並部署

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0,10 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "dist/data/deals.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下載專案
        uses: actions/checkout@v7

      - name: 準備 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: 安裝抓取工具
        run: pip install -r requirements.txt

      - name: 更新好康資料
        run: python scripts/update_deals.py

      - name: 保存本次資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/deals.json
          git diff --cached --quiet || git commit -m "data: update daily deals"
          git push

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包靜態網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
